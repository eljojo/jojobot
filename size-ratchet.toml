# The size ratchet (rules 273 and 597). `bar size` checks the tree against it.
# A file over `cap` lines is listed with its exact line count. A listed file
# may not grow, and a file over the cap that is not listed is refused.
# `bar size --write` lowers an entry or deletes it, and adds nothing.
# To raise an entry, set `lines` to the new count and add `raised_by` with
# the card that justifies it. Any other raise is refused against the base.

