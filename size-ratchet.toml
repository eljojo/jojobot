# The size ratchet (rules 273, 597, 661 and 704). `bar size` checks the tree and
# the change against it.
#
# A file over `cap` lines is red, of any kind: a new one is refused and a red file
# may not grow against the base. A file over 2000 lines and not red is yellow, and
# warns when it is new or grew. The cap only falls. `test_file_bytes` is the byte
# limit of an added file under a tests directory (rule 661) and only falls too.
# `step` is the step of the series that the next change is made in.
#
# A red file may grow only under a table of its own:
#
#   [[raise]]
#   path = "crates/example/src/big.rs"
#   rule = 704
#
# `rule` is the number of the operator's rule that allows it. The base must not
# already hold the same path and rule, so a rule pays for one raise. The check
# prints each raise for the engineer in charge to read.

cap = 5000
test_file_bytes = 100000
step = "9.3.1"
