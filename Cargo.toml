# jojobot — a personal-assistant server that fronts life-layer services and
# exposes itself through one MCP. User-agnostic software: everything
# instance-specific is data or runtime config, never code.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
# **Names the pinned toolchain** (`rust-toolchain.toml`), the only Rust that builds
# this workspace. It moves with that pin, in the same commit.
rust-version = "1.95"
repository = "https://github.com/eljojo/jojobot"

[workspace.dependencies]
# --- async runtime + web ---
# `process` and `time`: jojobot spawns the store's server and waits for it to
# start answering, which is a child process and a poll rather than a sleep.
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "process",
    "time",
] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
tokio-util = "0.7"

# --- MCP SDK (isolated behind the jojobot-mcp adapter; the domain never imports it) ---
# rmcp ships breaking majors, so it stays behind the adapter and the domain
# never imports it. The requirement is the 3.1 stable line, which admits
# patches; the exact pin the 3.0 betas needed is gone with them.
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
# **Named separately, because rmcp does not pin it.** rmcp requires its macro
# crate with a caret, so the two can drift apart in resolution: a `#[tool_handler]`
# from one version generates a `get_info` that must typecheck against the other
# version's `ServerHandler`. This requirement holds the macro crate on the same
# 3.1 line as rmcp itself. It is a direct dependency solely to carry that
# requirement; nothing in the workspace imports it by name.
rmcp-macros = "3.1"
schemars = "1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- async traits: the Memory port is async (its real adapter does I/O) and
# dyn-dispatched (Arc<dyn Memory>); async-trait keeps it object-safe ---
async-trait = "0.1"

# --- time: civil/zoned split at the type level (the bare-Z bug becomes uncompilable) ---
jiff = "0.2"
# RFC 5545 recurrence rules: a maintained crate, so no date arithmetic of our own.
rrule = "0.14"
# The rrule crate speaks chrono dates; this crate only builds and reads them.
chrono = { version = "0.4", default-features = false }

# --- auth: the one security-critical module we own ---
# jsonwebtoken 11 requires an explicit crypto provider; rust_crypto is pure Rust
# (no aws-lc/cmake). Without this it compiles but panics verifying any signature.
jsonwebtoken = { version = "11", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
# native-tls (OpenSSL) — the reliably-cached path in nixpkgs. The only TLS
# client here is the JWKS fetch to the issuer; the MCP transport terminates TLS
# at the ingress, not in-process.
# `form`: the browser UI exchanges an authorization code at the issuer's token
# endpoint, and OAuth's token request is form-encoded.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "default-tls",
] }

# --- full-text search: the index behind the `search` verb ---
# Default features off on purpose: they buy on-disk directories (mmap, file
# locking) and compression, and this index lives in RAM and is rebuilt from the
# store at start — so none of that is load-bearing, it is only build time.
tantivy = { version = "0.26", default-features = false, features = ["stemmer"] }

# --- the mailbox and session store: Dolt, spoken to over the MySQL wire ---
# Default features off and the runtime named: the defaults pull a TLS stack and
# every driver, and this talks to one child process over loopback TCP on the
# same machine, where there is nothing to encrypt and nothing else to speak to.
# 0.9 takes a statement built at run time only inside `AssertSqlSafe`, so each
# place that formats one says in the code that nothing a caller sent is in it.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "mysql",
    "macros",
] }

futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# --- entropy: the session handle is minted here, and a handle a caller could
# predict is a handle a caller could forge. OS entropy, no PRNG state to seed. ---
getrandom = "0.4"

# --- the kernel's own cleanup: a spawned server is asked to die with the
# process that spawned it, which is the one ending an unwind cannot reach ---
libc = "0.2"

# --- errors + logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"

# --- internal crates ---
jojobot-domain = { path = "crates/jojobot-domain" }
jojobot-adapters = { path = "crates/jojobot-adapters" }
jojobot-mcp = { path = "crates/jojobot-mcp" }
jojobot-ports = { path = "crates/jojobot-ports" }
jojobot-roster = { path = "crates/jojobot-roster" }

[profile.release]
lto = "thin"

# **The dev loop's profiles.** A test run compiles in the dev profile, and an
# unoptimised fold, search index and store client made the stories, the mcp
# lib and the adapters lib spend most of their time in dependency code.
# Dependencies build at opt-level 2 and the workspace crates at 1; the cost is
# paid once, on a cold target directory.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"
