[package]
name = "jojobot-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Anti-corruption layer: each store's quirks die here, invisible to the domain.
# Today that is the Dolt store, which holds memory, mailboxes, sessions and
# teachings, and the in-RAM search index over it.
[dependencies]
jojobot-domain.workspace = true
# The one arbiter for the ports the suites hand out. Optional, and only the
# `testing` feature pulls it in, so it never ships in a production build.
jojobot-ports = { workspace = true, optional = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
# The search projection: an in-RAM full-text index over facts, entities and prose.
tantivy = { workspace = true }
tracing = { workspace = true }
# The async runtime the store's pool and its supervised child process run on.
tokio = { workspace = true }
# The store. jojobot spawns `dolt sql-server` and talks to it over loopback TCP;
# sqlx is the wire client.
sqlx = { workspace = true }
futures-core.workspace = true
futures-util.workspace = true
# The store's startup failures are a typed enum like every other error here.
thiserror = { workspace = true }
# The store's server is asked to die with jojobot, and that is a kernel flag set
# between the fork and the exec rather than anything the parent can do after.
libc = { workspace = true }
# Test support only, behind the `testing` feature: the log sink a test that starts
# a store has installed. The scan's split-brain report and a refused migration are
# log lines, and "it gets logged" is not a claim a test can make by reading the
# code — this subscribes to the events and asserts on what actually came out.
tracing-subscriber = { workspace = true, optional = true }
# Test support only: forwards records from the `log` crate, which tantivy logs
# through, into the same sink. A production binary does this when it starts its
# subscriber, so a test that does not would never see what production logs.
tracing-log = { workspace = true, optional = true }

# The port helper these suites share lives behind this feature so it compiles
# for tests and NEVER ships in a production binary.
[features]
testing = ["dep:jojobot-ports", "dep:tracing-subscriber", "dep:tracing-log"]

[dev-dependencies]
tokio = { workspace = true }
jojobot-roster.workspace = true
# This crate's own integration suites use its test support, which the feature
# above keeps out of a normal build.
jojobot-adapters = { path = ".", features = ["testing"] }
# The shared contract + fake live behind the domain's `testing` feature; the
# contract runs here against the real Dolt store (tests/dolt_store.rs).
jojobot-domain = { workspace = true, features = ["testing"] }
