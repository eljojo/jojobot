[package]
name = "jojobot-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Anti-corruption layer: one adapter per fronted service. Every quirk
# (timezones, bare-Z CalDAV dates, silently-ignored cross-project filters,
# HTML-entity corruption) dies here, invisible to the domain. The Outline store
# is the first adapter — it hits the Outline API directly (the server is allowed
# to; the MCP-only rule is for the assistant-in-session, not the server).
[dependencies]
jojobot-domain.workspace = true
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
# The search projection: an in-RAM full-text index over facts, entities and prose.
tantivy = { workspace = true }
tracing = { workspace = true }
# The Vikunja store's per-store verb lock. jojobot is the only machine writer to
# its own mailbox project, so linearizing its own verbs against each other
# removes every jojobot-vs-jojobot race by construction — see `VikunjaStore`'s
# § The lock for the constraint that buys.
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The shared contract + fake live behind the domain's `testing` feature; the
# contract runs here against the real Outline adapter (gated integration test).
jojobot-domain = { workspace = true, features = ["testing"] }
# Dev only. The scan's split-brain report IS a log line, and "it gets logged" is
# not a claim a test can make by reading the code — this subscribes to the
# events and asserts on what actually came out.
tracing-subscriber = { workspace = true }
