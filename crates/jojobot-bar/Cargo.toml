[package]
name = "jojobot-bar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Dev tooling: wraps `cargo test`/`cargo clippy`/`cargo fmt` and prints a
# short verdict instead of the raw stream. No dependency on the domain or the
# adapters. It shares scratch names with the OS-only harness arbiter and reads
# cargo's own output: text for the test
# runs, and `cargo metadata` JSON for the packages `bar dev` selects.
[dependencies]
jojobot-ports.workspace = true
# The CI classifier is a leaf so domain edits do not rebuild the static gate.
jojobot-roster.workspace = true
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
