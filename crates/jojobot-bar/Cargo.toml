[package]
name = "jojobot-bar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Dev tooling: wraps `cargo test`/`cargo clippy`/`cargo fmt` and prints a
# short verdict instead of the raw stream. No dependency on the domain or the
# adapters — it reads cargo's own output and nothing else: text for the test
# runs, and `cargo metadata` JSON for the packages `bar dev` selects.
[dependencies]
libc.workspace = true
serde_json.workspace = true

