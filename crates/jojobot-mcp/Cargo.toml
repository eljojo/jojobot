[package]
name = "jojobot-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The MCP adapter: the only crate that imports rmcp. It maps MCP tool calls to
# the domain and back. rmcp's breaking majors are absorbed here.
[dependencies]
jojobot-domain.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true }
# The fake behind the domain's `testing` feature backs the MCP verb tests, so
# capture/recall are exercised through the handler with no network.
jojobot-domain = { workspace = true, features = ["testing"] }
# The start_here down-world test stubs the Mailboxes port, which is async-trait.
async-trait = { workspace = true }
