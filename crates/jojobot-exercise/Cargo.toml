[package]
name = "jojobot-exercise"
version.workspace = true
default-run = "jojobot-exercise"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# **The third test tier.** The other two ask whether the code works; this one
# drives a real model through the surface as shipped and asks whether the
# surface teaches itself. It costs money, so nothing here runs from `cargo
# test` — the paid half is a binary somebody has to invoke, and the machinery
# below it is a library with ordinary free tests.
[dependencies]
# `sync` is for `OnceCell`: the template a room copies instead of migrating
# is built at most once per process, however many rooms ask for it at once.
tokio = { workspace = true, features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# The session ids a run names its own conversations with.
getrandom.workspace = true
# A room's server is asked to die with the run that opened it, and the store
# a dead run left behind is signalled by pid — both are kernel calls.
libc.workspace = true
# The one arbiter for loopback ports, shared with the store suites. It has no
# dependencies of its own, so the harness still links nothing of jojobot.
jojobot-ports.workspace = true
# The MCP client the driver reaches the spawned server with — the same crate
# and the same transport a real client uses, so what is under test is the
# served surface rather than a shortcut into the process.
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }

[dev-dependencies]
# The room tests spawn the shipped server, so they need an async runtime
# with process control — the same features the server itself takes.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }

# **The room suites are opt-in.** Each test file named below stands up a room:
# it spawns the shipped server and a store of its own, so it costs seconds to
# minutes and is the slow part of the bar. `make check` runs none of them. A
# target with a feature it needs is skipped by `cargo test` when the feature
# is off, so the list below is the whole mechanism — nothing in the bar names
# a room.
#
# `make rooms` turns `rooms` on. `make room ROOM=year` and the pre-push target
# turn `year` on as well: the year room is the slowest and runs only before a
# push. A test file NOT named here still runs in `make check`, so a new room
# suite that nobody lists is slow rather than unrun.
#
# Lint reads every target with `--all-features`, so a room suite is compiled
# and linted by `make check` even though it does not run there.
[features]
rooms = []
year = []

[[test]]
name = "adoption_room"
required-features = ["rooms"]

