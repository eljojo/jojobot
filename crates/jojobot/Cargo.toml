[package]
name = "jojobot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "jojobot"

[features]
default = []
# Only the exercise harness enables this; shipped builds expose no grader.
room-harness = []

# The composition root: wires the MCP adapter onto an HTTP transport and owns
# the resource-server auth. This is the only place rmcp's transport and the
# auth layer meet. Nothing user-specific is compiled in — issuer, audience and
# resource are all runtime configuration.
[dependencies]
jojobot-mcp.workspace = true
jojobot-domain.workspace = true
jojobot-adapters.workspace = true
rmcp.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
# The ports are async and dyn-compatible through async-trait: the ntfy sender
# implements the domain's `Notifier`, and a story fixture that wraps a store to
# make it unreachable implements `Memory` the same way.
async-trait.workspace = true
# PKCE: the challenge is base64url of a SHA-256, and both halves are spelled out
# in RFC 7636. Nothing else here hashes or encodes.
sha2 = "0.10"
base64 = "0.22"
thiserror.workspace = true
anyhow.workspace = true
# The page that runs a view compares a due day to the server's clock, and a day
# here is the domain's civil date.
jiff.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The request log wraps a response's body to see when it ends or is dropped.
http-body = "1"
# A document's page is its markdown rendered as HTML. A CommonMark event stream
# is what lets the page decide each event, so raw HTML, images and link targets
# are rewritten before anything is written out. Only the HTML writer is used.
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
# The metrics listener writes the text a Prometheus scraper reads. This is the
# Prometheus project's own client, and its label sets are typed, so a label is a
# field the code names and never a value a caller sends.
prometheus-client = "0.25"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# A case on the slow-call warning moves the clock instead of waiting a minute.
tokio = { workspace = true, features = ["test-util"] }
# The fake store behind the domain's `testing` feature: the end-to-end tests
# need a store that actually holds a write, with no network.
jojobot-domain = { workspace = true, features = ["testing"] }
# `free_port`, for a test that spins up its own real Dolt store to prove the
# boot's seed-before-guard ordering against the real adapter, not a fake that
# cannot reproduce the failure (the fake never re-parses a kind from a stored
# row, so it is not hostile where the real store is).
jojobot-adapters = { workspace = true, features = ["testing"] }
# rmcp client, for the end-to-end ping test. native-tls keeps the test build off
# aws-lc/cmake, matching the server's TLS choice (the test server is plain HTTP).
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
# A boot test breaks one table by hand, against the real store's own pool, to
# prove a downstream read failing does not refuse the boot.
sqlx = { workspace = true }
# `server_binary`, so the real-binary boot test locates the shipped server the
# same way every room does — refusing a stale one — instead of a second way
# to find it.
jojobot-exercise = { path = "../jojobot-exercise" }
# Tantivy logs through the `log` crate, and the binary's subscriber bridges it
# into tracing; the case on the merge-warning filter sends its events that way.
tracing-log = { workspace = true }
# The metrics cases read every line a scrape answers with a strict OpenMetrics
# parser, so a line a scraper would drop fails the case.
openmetrics-parser = "0.5"
