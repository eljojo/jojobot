[package]
name = "jojobot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "jojobot"

# The composition root: wires the MCP adapter onto an HTTP transport and owns
# the resource-server auth. This is the only place rmcp's transport and the
# auth layer meet. Nothing user-specific is compiled in — issuer, audience and
# resource are all runtime configuration.
[dependencies]
jojobot-mcp.workspace = true
jojobot-domain.workspace = true
jojobot-adapters.workspace = true
rmcp.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
# PKCE: the challenge is base64url of a SHA-256, and both halves are spelled out
# in RFC 7636. Nothing else here hashes or encodes.
sha2 = "0.10"
base64 = "0.22"
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The fake store behind the domain's `testing` feature: the end-to-end tests
# need a store that actually holds a write, with no network.
jojobot-domain = { workspace = true, features = ["testing"] }
# rmcp client, for the end-to-end ping test. native-tls keeps the test build off
# aws-lc/cmake, matching the server's TLS choice (the test server is plain HTTP).
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
