[package]
name = "jojobot-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The domain is pure: no I/O, no rmcp, no service clients. It owns the
# ubiquitous language and the invariants. Adapters depend on it, never the
# reverse.
[dependencies]
# async-trait: the Memory port is I/O in its real adapter (the Dolt store),
# so the port method is async. async-trait keeps it dyn-compatible (Arc<dyn
# Memory>) — no wire types leak in; this is still pure vocabulary.
async-trait = { workspace = true }
# getrandom: a drawn handle comes from OS entropy, and the shape rules for one
# already live here. It is a syscall for randomness, not a store or a wire —
# nothing about a fronted service crosses with it.
getrandom = { workspace = true }
serde = { workspace = true }
# sha2: a run's key is stored as its SHA-256 and never as itself, and the hash
# is a pure function of the key, so it lives beside the key's shape rules.
sha2 = "0.10"
jiff = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
# tokio: a request id travels from the dispatch to the commit that stores the
# write in a task-local, which is scheduling machinery and does no I/O. The
# shared contract's own race case also joins two real futures with
# `tokio::join!`, which only the `testing` feature uses.
tokio = { workspace = true }

# The in-memory fake and the shared contract spec live behind this feature so
# they compile for tests (here and in downstream crates) but NEVER ship in a
# production binary.
[features]
testing = []

[dev-dependencies]
tokio = { workspace = true }
# serde_json: the capture gate parses recorded agent streams as JSON rather
# than grepping them, so a key inside a quoted payload is not read as a field.
# Tests only — the domain itself still touches no wire format.
serde_json = { workspace = true }
# This crate's own integration suites use its fake, which the feature above
# keeps out of a production build.
jojobot-domain = { path = ".", features = ["testing"] }
