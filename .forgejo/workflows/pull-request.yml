# The bars that outlive a session, run on every pull request to main and to a
# deploy branch.
#
# This repository is built by disposable implementer sessions that report their
# own results. A bar that runs only when a session types the command and reads
# the exit code honestly looks exactly like a green build when the session
# forgets. These jobs run without anybody remembering them.
#
# The job names are `check`, `rooms` and `year`, and they are exactly those on
# purpose: they become the required status checks of main, and a rename here
# silently removes a requirement there. `build` is not one of them: it compiles
# the test binaries the other three run.
#
# The startup plan reads the same level rules as the bar. Verification stays
# in the `make` targets the house rules name, so there is one standard.
name: pull-request

on:
  pull_request:
    branches:
      - main
      # A carry into a deploy branch is landed by a pull request too.
      - 'deploy-*'
  # The dispatch ref is the branch, tag or whole SHA to test. Checkout uses
  # that event revision, so the run's commit_sha is the tested tree.
  workflow_dispatch:

# The newest head wins. A newer push to the same pull request cancels the older
# run, started or not, because a superseded head's verdict is about code nobody
# will land. The group is keyed on the pull request number: on this event the
# ref does not name the pull request, so two pull requests would share a group.
# Dispatches use their ref and event, and cannot cancel a pull-request run.
concurrency:
  group: pull-request-${{ forgejo.event_name }}-${{ forgejo.event.pull_request.number }}-${{ forgejo.ref }}
  cancel-in-progress: true

# The checkout path every job of one run shows to its command. The run's id
# makes it the same in every job and different between two runs on one host.
env:
  BAR_CI_BASE: ${{ forgejo.event.pull_request.base.sha }}
  # Dispatch QA is on the deploy-9 release line; the diff exemption above
  # has no dispatch base and therefore never applies to a full dispatch.
  SIZE_BASE: ${{ forgejo.event.pull_request.base.sha || 'origin/deploy-9' }}
  JOJOBOT_METRICS_WORKFLOW: pull-request
  JOJOBOT_METRICS_JOB: ${{ forgejo.job }}
  JOJOBOT_BUILD_METRICS_FILE: target/bar/metrics-${{ forgejo.run_id }}-${{ forgejo.job }}.jsonl
  CI_ROOT: /tmp/jojobot-ci/${{ forgejo.run_id }}

# The bundle holds binaries of one architecture, and the label `nix` also names
# an aarch64 host. The build and every job that runs the bundle use
# `nix-x86_64`, which only x86_64 hosts carry.
#
# The runner labelled `nix-x86_64` is a host executor: the job runs on the machine
# itself, sees only the runner's own directory, and reaches the internet and
# the Forgejo host. The flake is the toolchain, so each job enters it with
# `nix develop`. Nothing is installed by the job.
jobs:
  # **The one job that compiles the test binaries.** `check`, `rooms` and `year`
  # run these binaries side by side and compile no test of their own. A test
  # binary reads its files by the checkout path it was compiled in, so every
  # job runs its command through `CI_ROOT`, which shows its own checkout at that
  # one path (`scripts/ci-root`).
  build:
    runs-on: nix-x86_64
    steps:
      - name: Level
        run: |
          echo 'level: boundary; workflow jobs: build, check, rooms, year; left to boundary: none'
      # The whole history, for the same reason as the jobs below.
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        id: plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan build 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      # Each run leaves its empty `CI_ROOT` behind: the directory is a mount
      # point in every job's namespace, and removing it while another job
      # still holds it would unmount it there. A day-old one has no holder.
      - run: find /tmp/jojobot-ci -mindepth 1 -maxdepth 1 -type d -empty -mtime +0 -delete || true
      - name: Last deployed store
        if: ${{ steps.plan.outputs.fast != 'true' }}
        run: nix develop -c python3 scripts/prepare-upgrade-fixture
        env:
          UPGRADE_FIXTURE_DIR: target/upgrade-fixture
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: upgrade-fixture
          path: target/upgrade-fixture
          retention-days: 1
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: nix develop -c make bundle CI_ROOT=${{ env.CI_ROOT }}
      # The bundle is kept a day: a re-run of one job below needs it.
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: test-bundle
          path: target/bundle.tar.gz
          retention-days: 1
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-build
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
      # Samples are secondary evidence; collection and delivery cannot change the verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}

  check:
    needs: build
    runs-on: nix-x86_64
    steps:
      - name: Level
        run: |
          echo 'level: boundary; workflow jobs: build, check, rooms, year; left to boundary: none'
      # The whole history, not the default depth of one commit. The fixture
      # roster test reads the commit messages since a fixed boundary and fails
      # when it cannot read the range, so a one-commit checkout is red on every
      # run.
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        id: plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan check 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: test-bundle
          path: target/bundle-download
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: nix develop -c tar -xzf target/bundle-download/bundle.tar.gz
      # SIZE_BASE is the commit the pull request targets, for the size check's
      # base half. It is a commit rather than a branch name: the checkout holds
      # the history but may not hold a local branch of that name.
      - if: ${{ steps.plan.outputs.fast == 'true' }}
        run: nix develop -c make check
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: upgrade-fixture
          path: target/upgrade-fixture
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: scripts/stop-with-siblings nix develop -c make check CI_ROOT=${{ env.CI_ROOT }}
        env:
          BAR_BUNDLE: target/bundle/manifest.json
          TOKEN: ${{ forgejo.token }}
          UPGRADE_FIXTURE_DIR: target/upgrade-fixture
          SIZE_BASE: ${{ forgejo.event.pull_request.base.sha || 'origin/deploy-9' }}
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-check
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
      # Samples are secondary evidence; collection and delivery cannot change the verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}

  # Every room suite except the year room. A room spawns the built server,
  # which the bundle carries.
  rooms:
    needs: build
    runs-on: nix-x86_64
    steps:
      - name: Level
        run: |
          echo 'level: boundary; workflow jobs: build, check, rooms, year; left to boundary: none'
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        id: plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan rooms 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: test-bundle
          path: target/bundle-download
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: nix develop -c tar -xzf target/bundle-download/bundle.tar.gz
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: scripts/stop-with-siblings nix develop -c make rooms CI_ROOT=${{ env.CI_ROOT }}
        env:
          BAR_BUNDLE: target/bundle/manifest.json
          TOKEN: ${{ forgejo.token }}
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-rooms
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
      # Samples are secondary evidence; collection and delivery cannot change the verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}

  # The year room is the slowest suite and no other target runs it. It runs as
  # one binary: it caches its furnished seed per process.
  year:
    needs: build
    runs-on: nix-x86_64
    steps:
      - name: Level
        run: |
          echo 'level: boundary; workflow jobs: build, check, rooms, year; left to boundary: none'
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        id: plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan year 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: test-bundle
          path: target/bundle-download
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: nix develop -c tar -xzf target/bundle-download/bundle.tar.gz
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: scripts/stop-with-siblings nix develop -c make year CI_ROOT=${{ env.CI_ROOT }}
        env:
          BAR_BUNDLE: target/bundle/manifest.json
          TOKEN: ${{ forgejo.token }}
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-year
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
      # Samples are secondary evidence; collection and delivery cannot change the verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}
