# One boundary selection, including real-store cases, on the dispatch's ref/SHA.
# POST actions/workflows/targeted.yml/dispatches with:
# {"ref":"<branch-or-sha>","inputs":{"crate":"jojobot-adapters","FILTER":"<case-substring>"}}
# This workflow is never a proof of the release gate.
name: targeted

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Cargo crate to test'
        required: true
      FILTER:
        description: 'One test-name substring (letters, digits, _ or :)'
        required: true

concurrency:
  group: targeted-${{ forgejo.ref }}-${{ forgejo.event.inputs.crate }}-${{ forgejo.event.inputs.FILTER }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: nix
    timeout-minutes: 60
    env:
      CRATE: ${{ forgejo.event.inputs.crate }}
      FILTER: ${{ forgejo.event.inputs.FILTER }}
    steps:
      - name: Level
        run: |
          echo 'level: boundary, targeted; workflow jobs: targeted; run requested crate/FILTER; left to full boundary: other tests'
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan targeted "$CRATE" "$FILTER" 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - run: nix develop -c make narrow CRATE="$CRATE" FILTER="$FILTER"
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-targeted
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
