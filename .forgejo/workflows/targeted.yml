# One boundary selection, including real-store cases, on the dispatch's ref/SHA.
# POST actions/workflows/targeted.yml/dispatches with:
# {"ref":"<branch-or-sha>","inputs":{"crate":"jojobot-adapters","FILTER":"<case-substring>"}}
# This workflow is never a proof of the release gate.
name: targeted

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Cargo crate to test'
        required: true
      FILTER:
        description: 'One test-name substring (letters, digits, _ or :)'
        required: true

concurrency:
  group: targeted-${{ forgejo.ref }}-${{ forgejo.event.inputs.crate }}-${{ forgejo.event.inputs.FILTER }}
  cancel-in-progress: true

jobs:
  targeted:
    runs-on: nix
    timeout-minutes: 60
    env:
      CRATE: ${{ forgejo.event.inputs.crate }}
      FILTER: ${{ forgejo.event.inputs.FILTER }}
    steps:
      - name: Runner cleanup
        run: |
          [ -z "${JOJOBOT_PRE_JOB:-}" ] || "$JOJOBOT_PRE_JOB"
      - name: Level
        run: |
          echo 'level: boundary, targeted; workflow jobs: targeted; run requested crate/FILTER; left to full boundary: other tests'
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan targeted "$CRATE" "$FILTER" 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      # **The deployed-store cases need the fixture, and narrow skips them without it.**
      # A FILTER that appears in the gate's sources or in narrow's list of fixture
      # cases (a case name, `deaths::`, `kitchen_sink::`) records the same last
      # deployed store the check job downloads, with the same cache, and narrow
      # then runs those cases. Any other FILTER prepares nothing and runs as before.
      # The cases do not read BOOT_STORE_DIR, so the grown store is not built.
      - name: Last deployed store
        run: |
          if [ "$CRATE" = jojobot ] && grep -rqF -- "$FILTER" \
              crates/jojobot-bar/src/local_upgrade.rs crates/jojobot/tests/upgrade_gate.rs crates/jojobot/tests/upgrade_gate/; then
            UPGRADE_FIXTURE_DIR="$PWD/target/upgrade-fixture" nix develop -c python3 scripts/prepare-upgrade-fixture
            echo "UPGRADE_FIXTURE_DIR=$PWD/target/upgrade-fixture" >> "$GITHUB_ENV"
          else
            echo 'FILTER selects no deployed-store case: no fixture prepared'
          fi
      - run: nix develop -c make narrow CRATE="$CRATE" FILTER="$FILTER"
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-targeted
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
