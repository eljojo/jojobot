# Release QA, run by the EM by dispatch on the head about to be pushed.
#
# `make prepush` is the whole bar, the real store, every room, the year room,
# the package build and the flake check. Every step runs and each reports, so
# a red first step does not hide whether the rest are green.
#
# It is the gate before a push to the deploy branch, not a run after every
# carry, so it has no push trigger. Only `workflow_dispatch` starts it.
name: prepush

on:
  workflow_dispatch:

# One run at a time, and the newest head wins. A newer dispatch cancels the
# older run, started or not, because a superseded head's verdict is about code
# nobody will push.
concurrency:
  group: prepush
  cancel-in-progress: true

jobs:
  prepush:
    # A host executor: see pull-request.yml for what the runner sees.
    runs-on: nix
    steps:
      # The whole history, for the same reason as the pull-request jobs: the
      # fixture roster test reads the commit range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: nix develop -c make prepush
