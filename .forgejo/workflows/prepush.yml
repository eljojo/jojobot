# Release QA, run by the EM by dispatch on the head about to be pushed.
#
# `make prepush` is the whole bar, the real store, every room, the year room,
# the package build and the flake check. Every step runs and each reports, so
# a red first step does not hide whether the rest are green.
#
# It is the gate before a push to the deploy branch, not a run after every
# carry, so it has no push trigger. Only `workflow_dispatch` starts it.
name: prepush

env:
  SIZE_BASE: origin/main
  JOJOBOT_METRICS_WORKFLOW: prepush
  JOJOBOT_METRICS_JOB: ${{ forgejo.job }}
  JOJOBOT_BUILD_METRICS_FILE: target/bar/metrics-${{ forgejo.run_id }}-${{ forgejo.job }}.jsonl

on:
  workflow_dispatch:

# One run at a time for each ref, and the newest head wins. A newer dispatch on
# the same ref cancels the older run, started or not, because a superseded
# head's verdict is about code nobody will push. A dispatch on another ref has
# a group of its own and cancels nothing.
concurrency:
  group: prepush-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  prepush:
    # A host executor: see pull-request.yml for what the runner sees.
    runs-on: nix
    # About twice its usual run, so a hung job fails inside the runner's own cap.
    timeout-minutes: 130
    steps:
      - name: Level
        run: |
          echo 'level: boundary; workflow jobs: check, rooms, year, nix-build, flake-check; completed PR jobs may be reused; left to boundary: none'
      # The whole history, for the same reason as the pull-request jobs: the
      # fixture roster test reads the commit range.
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan prepush 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - name: Last deployed store
        run: nix develop -c python3 scripts/prepare-upgrade-fixture
        env:
          UPGRADE_FIXTURE_DIR: target/upgrade-fixture
      - run: nix develop -c make prepush
        env:
          UPGRADE_FIXTURE_DIR: target/upgrade-fixture
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-prepush
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
      # Samples are secondary evidence; collection and delivery cannot change the verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}
