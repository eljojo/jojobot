# The report bar and the rooms, run when an implementer line pushes its working
# branch.
#
# A line pushes and keeps working while the runners take the bar, so the bar
# never runs on the line's own host. The branches are the lines' working
# branches, `dev-work`, `dev2-work` and so on.
#
# A push to a working branch is a progress signal, so it runs `make report`,
# which lets go the slow jobs the history allows. The full `make check` runs on
# the pull request and at the carry, and the year room runs there too. The job
# is named `report`, not `check`, so it is never mistaken for the required
# `check` status.
#
# The rooms run on a push where its change selects them (rule 760): `bar plan
# rooms` reads the crate selection, and a push that changes no room document, no
# room test file and not the exercise harness skips the rooms step and says why;
# a server-crate change, the domain included, does not select them. The rooms
# run in full on the landing's pull request and at the release gate, and a
# dispatch naming this job runs them whatever the change. The job
# is named `rooms`, as on the pull request, and it is not a required status.
# The year room stays on the pull request and the carry only.
name: branch

on:
  push:
    branches:
      - 'dev*-work'
  # One job of a run, run alone. The forge has no endpoint to re-run a job, so a
  # line starts the workflow again on its branch and names the job:
  #   POST /api/v1/repos/jojo/jojobot/actions/workflows/branch.yml/dispatches
  #   {"ref": "<branch>", "inputs": {"job": "rooms"}}
  # An empty `job` runs both. The input is a string and not a choice: a choice
  # with an empty option is a workflow file this forge could refuse to read, and
  # a file it cannot read stops every push to a working branch.
  workflow_dispatch:
    inputs:
      job:
        description: 'report or rooms; empty runs both'
        required: false
        default: ''

# The newest head wins. A newer push to the same branch cancels the older run,
# started or not, because a superseded head's verdict is about code nobody will
# land. The group is keyed on the ref, so two lines never share one. **A
# dispatch has a group of its own, one for each job it names**: in the group of
# the push it would cancel the push's run, and the job beside the one it reruns.
concurrency:
  group: branch-${{ forgejo.ref }}-${{ forgejo.event_name }}-${{ forgejo.event.inputs.job }}
  cancel-in-progress: true

env:
  BAR_WORKFLOW_JOBS: ${{ forgejo.event.inputs.job || 'report, rooms' }}
  BAR_BOUNDARY_LEFT: ${{ forgejo.event.inputs.job == 'report' && 'rooms, history-eligible slow tests, year' || forgejo.event.inputs.job == 'rooms' && 'report tests, year' || forgejo.event_name == 'push' && 'rooms unless a room file changed, history-eligible slow tests, year' || 'history-eligible slow tests, year' }}
  BAR_CI_BASE: ${{ forgejo.event.before }}
  # Select only on working-branch pushes. Dispatch and every boundary lane
  # keep their full plan. A job with no trunk line leaves the base unset, and the selector runs everything.
  BAR_SELECT_BY_CRATE: ${{ forgejo.event_name == 'push' && '1' || '0' }}
  SIZE_BASE: origin/main
  JOJOBOT_METRICS_WORKFLOW: branch
  JOJOBOT_METRICS_JOB: ${{ forgejo.job }}
  JOJOBOT_BUILD_METRICS_FILE: target/bar/metrics-${{ forgejo.run_id }}-${{ forgejo.job }}.jsonl

jobs:
  # Cheap refusals precede the served-text build and every expensive job.
  static:
    runs-on: nix
    timeout-minutes: 120
    steps:
      - name: Level
        run: |
          echo "level: report; workflow jobs: static, $BAR_WORKFLOW_JOBS; left to boundary: $BAR_BOUNDARY_LEFT"
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build-free gates
        run: |
          mkdir -p target/bar
          status=0
          nix develop -c make static >target/bar/static.log 2>&1 || status=$?
          cat target/bar/static.log
          exit "$status"
      - name: Served text snapshot
        run: |
          mkdir -p target/bar
          status=0
          nix develop -c env SNAPSHOT_UPDATE=0 make narrow CRATE=jojobot-mcp FILTER=snapshot::every_text_a_model_reads_matches_the_snapshot >target/bar/snapshot.log 2>&1 || status=$?
          cat target/bar/snapshot.log
          exit "$status"
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-static
          path: |
            target/bar/*.log
            target/bar/verdict-*.json
          retention-days: 7
          if-no-files-found: ignore
      # Samples cannot change the gate's verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}

  # The first verdict of a push: the tests and lint of the crates the branch
  # touched and of the crates that depend on them, through `make dev`, the one
  # way the bar picks crates. It has no `needs`, so it starts with `static` and
  # not after it, and it ends at its first red test. `report` and `rooms` run
  # everything they ran before; a red here stops them as any sibling's red does
  # (scripts/stop-with-siblings). A push only: a dispatch names the job it
  # reruns, and this is not one of them. BAR_OWN_CRATES measures the branch
  # against the trunk it is cut from, not `main`, and the SIZE_BASE here is the
  # bare `main` so that the trunk, not origin/main, is the base.
  own-crates:
    if: ${{ forgejo.event_name == 'push' }}
    runs-on: nix
    timeout-minutes: 30
    steps:
      - name: Level
        run: |
          echo "level: own-crates; workflow jobs: static, $BAR_WORKFLOW_JOBS; left to boundary: $BAR_BOUNDARY_LEFT"
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # A push that changed only docs has no crate to run: `make dev` refuses a
      # diff that touches no package, so the plan skips the step as it does for
      # the jobs beside this one.
      # The crate selection diffs against the remote line this branch is cut
      # from, the one `make dev` measures against. One fixed carry made every
      # branch cut from a later one a full run. No line found leaves the base
      # unset, and the selector then runs everything.
      - name: Job plan
        id: plan
        run: |
          trunk=$(nix develop -c cargo run -q --locked -p jojobot-bar -- trunk) || trunk=
          [ -z "$trunk" ] || export BAR_SELECT_BASE="$trunk"
          [ -z "$trunk" ] || echo "BAR_SELECT_BASE=$trunk" >> "$GITHUB_ENV"
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan report 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - name: Touched crates
        if: ${{ steps.plan.outputs.fast != 'true' }}
        run: scripts/stop-with-siblings nix develop -c make dev
        env:
          BAR_OWN_CRATES: '1'
          SIZE_BASE: main
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-own-crates
          path: |
            target/bar/*.log
            target/bar/verdict-*.json
          retention-days: 7
          if-no-files-found: ignore
      # Samples cannot change the gate's verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}

  report:
    needs: static
    # A push runs it, and so does a dispatch that names no job or names this one.
    if: ${{ forgejo.event_name != 'workflow_dispatch' || forgejo.event.inputs.job == '' || forgejo.event.inputs.job == 'report' }}
    # A host executor: see pull-request.yml for what the runner sees.
    runs-on: nix
    # The bar kills a test binary that runs past its own deadline (twenty minutes,
    # BINARY_DEADLINE in crates/jojobot-bar/src/deadline.rs), names it and keeps
    # its output, so a hang costs minutes and says where it is. This bound is the
    # last resort, ninety minutes. It was an hour, and before that two hours: runs
    # 762, 1640 and 1650 were silent hangs, not slow progress, and a raised bound
    # only held a runner longer. Measured 2026-10-26 from /actions/runs: in the
    # last day 80 of 88 runs ended under 60 minutes, p50 30, p90 48, p95 51. That
    # was an idle runner pool. With 13 runs sharing it on 2026-11-03, run 2928
    # printed a green verdict (184 suites, 4447 passed) and was killed at 60
    # minutes, so a finished bar was thrown away. A hang still costs at most the
    # test binary's own deadline, so 90 does not hold a runner longer for one.
    timeout-minutes: 90
    steps:
      - name: Level
        run: |
          echo "level: report; workflow jobs: static, $BAR_WORKFLOW_JOBS; left to boundary: $BAR_BOUNDARY_LEFT"
      # The whole history, for the same reason as the pull-request jobs: the
      # fixture roster test reads the commit range.
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # The crate selection diffs against the remote line this branch is cut
      # from, the one `make dev` measures against. One fixed carry made every
      # branch cut from a later one a full run. No line found leaves the base
      # unset, and the selector then runs everything.
      - name: Job plan
        id: plan
        run: |
          trunk=$(nix develop -c cargo run -q --locked -p jojobot-bar -- trunk) || trunk=
          [ -z "$trunk" ] || export BAR_SELECT_BASE="$trunk"
          [ -z "$trunk" ] || echo "BAR_SELECT_BASE=$trunk" >> "$GITHUB_ENV"
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan report 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
        env:
          BAR_PUSH_BASE: ${{ forgejo.event.before }}
      # The commit the push moved the branch from. The bar runs the jobs of the
      # packages that range touched first, and stops at the first red job, so a
      # case the push broke turns the run red without waiting for the other jobs.
      # A branch's first push, a dispatch and a rewritten branch name no commit
      # this checkout holds, and the bar then falls back to the merge base with
      # `main`.
      # A red sibling stops this job as failed (scripts/stop-with-siblings), with a
      # line naming the sibling and exit code 75; the run is not cancelled. This job
      # keeps its own status when it is the one that failed.
      - name: Last deployed store
        if: ${{ steps.plan.outputs.fast != 'true' }}
        run: scripts/stop-with-siblings nix develop -c python3 scripts/prepare-upgrade-fixture
        env:
          UPGRADE_FIXTURE_DIR: target/upgrade-fixture
          TOKEN: ${{ forgejo.token }}
      - run: scripts/stop-with-siblings nix develop -c make report
        env:
          UPGRADE_FIXTURE_DIR: target/upgrade-fixture
          BAR_PUSH_BASE: ${{ forgejo.event.before }}
          TOKEN: ${{ forgejo.token }}
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-report
          path: |
            target/bar/*.log
            target/bar/verdict-*.json
          retention-days: 7
          if-no-files-found: ignore
      # Samples are secondary evidence; collection and delivery cannot change the verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}

  # Every room suite except the year room, the same command as the pull
  # request's `rooms` job. It does not wait for `report`: the two run side by
  # side, so a red room is on the branch as early as a red report. `make rooms`
  # builds the workspace in the same command, because a room spawns the built
  # server.
  rooms:
    needs: static
    if: ${{ forgejo.event_name != 'workflow_dispatch' || forgejo.event.inputs.job == '' || forgejo.event.inputs.job == 'rooms' }}
    runs-on: nix
    # The bar kills a test binary that runs past its own deadline (twenty minutes,
    # BINARY_DEADLINE in crates/jojobot-bar/src/deadline.rs), names it and keeps
    # its output, so a hang costs minutes and says where it is. This bound is the
    # last resort, an hour as it was before it was raised to two: runs 762, 1640
    # and 1650 were silent hangs, not slow progress, and a raised bound only held a
    # runner longer. Measured 2026-10-26 from /actions/runs: in the last day 80 of
    # 88 runs ended under 60 minutes, p50 30, p90 48, p95 51.
    timeout-minutes: 60
    steps:
      - name: Level
        run: |
          echo "level: report; workflow jobs: static, $BAR_WORKFLOW_JOBS; left to boundary: $BAR_BOUNDARY_LEFT"
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # The crate selection diffs against the remote line this branch is cut
      # from, the one `make dev` measures against. One fixed carry made every
      # branch cut from a later one a full run. No line found leaves the base
      # unset, and the selector then runs everything.
      - name: Job plan
        id: plan
        run: |
          trunk=$(nix develop -c cargo run -q --locked -p jojobot-bar -- trunk) || trunk=
          [ -z "$trunk" ] || export BAR_SELECT_BASE="$trunk"
          [ -z "$trunk" ] || echo "BAR_SELECT_BASE=$trunk" >> "$GITHUB_ENV"
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan rooms 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - if: ${{ steps.plan.outputs.fast != 'true' }}
        run: scripts/stop-with-siblings nix develop -c make rooms
        env:
          TOKEN: ${{ forgejo.token }}
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-rooms
          path: |
            target/bar/*.log
            target/bar/verdict-*.json
          retention-days: 7
          if-no-files-found: ignore
      # Samples are secondary evidence; collection and delivery cannot change the verdict.
      - if: ${{ always() }}
        continue-on-error: true
        run: nix develop -c python3 scripts/build-metrics ci
        env:
          JOJOBOT_METRICS_OUTCOME: ${{ job.status }}
