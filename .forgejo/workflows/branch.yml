# The report bar and the rooms, run when an implementer line pushes its working
# branch.
#
# A line pushes and keeps working while the runners take the bar, so the bar
# never runs on the line's own host. The branches are the lines' working
# branches, `dev-work`, `dev2-work` and so on.
#
# A push to a working branch is a progress signal, so it runs `make report`,
# which lets go the slow jobs the history allows. The full `make check` runs on
# the pull request and at the carry, and the year room runs there too. The job
# is named `report`, not `check`, so it is never mistaken for the required
# `check` status.
#
# The rooms run on the branch too, beside the report (rule 527). A change to
# what a read returns by default can break a room that another line's card
# built, and only a room run sees it. Without this run the defect is found at
# the carry, one round trip after the line has reported. The job is named
# `rooms`, as on the pull request, and it is not a required status. The year
# room stays on the pull request and the carry only.
name: branch

on:
  push:
    branches:
      - 'dev*-work'
  # One job of a run, run alone. The forge has no endpoint to re-run a job, so a
  # line starts the workflow again on its branch and names the job:
  #   POST /api/v1/repos/jojo/jojobot/actions/workflows/branch.yml/dispatches
  #   {"ref": "<branch>", "inputs": {"job": "rooms"}}
  # An empty `job` runs both. The input is a string and not a choice: a choice
  # with an empty option is a workflow file this forge could refuse to read, and
  # a file it cannot read stops every push to a working branch.
  workflow_dispatch:
    inputs:
      job:
        description: 'report or rooms; empty runs both'
        required: false
        default: ''

# The newest head wins. A newer push to the same branch cancels the older run,
# started or not, because a superseded head's verdict is about code nobody will
# land. The group is keyed on the ref, so two lines never share one. **A
# dispatch has a group of its own, one for each job it names**: in the group of
# the push it would cancel the push's run, and the job beside the one it reruns.
concurrency:
  group: branch-${{ forgejo.ref }}-${{ forgejo.event_name }}-${{ forgejo.event.inputs.job }}
  cancel-in-progress: true

jobs:
  report:
    # A push runs it, and so does a dispatch that names no job or names this one.
    if: ${{ forgejo.event_name != 'workflow_dispatch' || forgejo.event.inputs.job == '' || forgejo.event.inputs.job == 'report' }}
    # A host executor: see pull-request.yml for what the runner sees.
    runs-on: nix
    # About twice its usual run, so a hung job fails inside the runner's own cap.
    timeout-minutes: 60
    steps:
      - name: Level
        run: |
          echo 'level: report; workflow jobs: report, rooms; left to boundary: history-eligible slow tests, year'
      # The whole history, for the same reason as the pull-request jobs: the
      # fixture roster test reads the commit range.
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan report 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
        env:
          BAR_PUSH_BASE: ${{ forgejo.event.before }}
      # The commit the push moved the branch from. The bar runs the jobs of the
      # packages that range touched first, and stops at the first red job, so a
      # case the push broke turns the run red without waiting for the other jobs.
      # A branch's first push, a dispatch and a rewritten branch name no commit
      # this checkout holds, and the bar then falls back to the merge base with
      # `main`.
      - run: nix develop -c make report
        env:
          BAR_PUSH_BASE: ${{ forgejo.event.before }}
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-report
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore

  # Every room suite except the year room, the same command as the pull
  # request's `rooms` job. It does not wait for `report`: the two run side by
  # side, so a red room is on the branch as early as a red report. `make rooms`
  # builds the workspace in the same command, because a room spawns the built
  # server.
  rooms:
    if: ${{ forgejo.event_name != 'workflow_dispatch' || forgejo.event.inputs.job == '' || forgejo.event.inputs.job == 'rooms' }}
    runs-on: nix
    # About twice its usual run, so a hung job fails inside the runner's own cap.
    timeout-minutes: 60
    steps:
      - name: Level
        run: |
          echo 'level: report; workflow jobs: report, rooms; left to boundary: history-eligible slow tests, year'
      - uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Job plan
        run: |
          mkdir -p target/bar
          nix develop -c cargo run -q --locked -p jojobot-bar -- plan rooms 2>target/bar/plan.log || { cat target/bar/plan.log >&2; exit 1; }
      - run: nix develop -c make rooms
      # The bar's own log, kept a week. The job log carries only the summary,
      # so a red case's output is in here or nowhere. v3: v4 refuses any host
      # but GitHub. A failed upload never changes the bar's verdict.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ${{ forgejo.server_url }}/${{ forgejo.repository_owner }}/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: bar-logs-rooms
          path: target/bar/*.log
          retention-days: 7
          if-no-files-found: ignore
